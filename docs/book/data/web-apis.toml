note = "In `k.animation`."

[[area.api]]
name = "Intl"
status = "partial"
k = ["k.core.NumberStyle", "k.core.DateStyle", "k.time.TimeZone"]
side = "both"
runtime = ["std.js", "money.js"]
feature = "k-i18n"
design = "35-time.md"
note = "Numbers, money, dates and relative times, always in the metadata locale on both sides. Localized strings and plurals are `k.i18n`."

[[area.api]]
name = "Web Bluetooth, WebUSB, Web Serial, WebHID, Web NFC, Web MIDI"
