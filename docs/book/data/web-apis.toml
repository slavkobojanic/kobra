# Which web platform APIs K wraps, how, and which it doesn't.
#
# The source of the generated part of docs/book/src/reference/web-platform.md, and checked by
# `cargo test -p k_sema --test it -- web_platform::` (crates/k_sema/tests/web_platform.rs). After an
# edit here, regenerate the page with
#
#   K_BLESS=1 cargo test -p k_sema --test it -- web_platform::
#
# How to update it is in docs/compiler/documentation.md §1 and §6; the decision is recorded in
# docs/design/49-documentation.md ("The web platform page"). The statuses come from the design topics'
# own decisions (docs/design/45-web-platform.md, "Inventory", and the topics it links); this file never
# makes a support claim the design and the stdlib don't.
#
# Each `[[area]]` is a heading of the page, in this order, with an optional `guide` (a book page,
# relative to docs/book/src) and `intro`. Each `[[area.api]]` is one row:
#
#   name      the API by its spec's name
#   status    "supported" (an app can do what the API does, through `k`), "partial" (some of it; the
#             note says what is missing), "planned" (the design records the direction) or
#             "not-planned" (the design decides against it, or covers it another way; the note says why)
#   tier      planned rows only: 2 (next, gets its own design topic) or 3 (when an app needs it);
#             a planned row without one is tracked by its `feature` instead
#   k         the K API: qualified stdlib declarations (`k.device.Clipboard`) or `event:<name>` for an
#             event every element has. Each must resolve in crates/k_sema/stdlib.
#   side      "client", "server" or "both": where the K API runs
#   runtime   the files of crates/k_runtime/js/runtime that implement it. Every runtime file is claimed
#             by a row or listed under [internal], so a new binding fails the check until it is here.
#   chromium, firefox
#             the real-browser tests that check it: `#[test]` functions of crates/k_cli/tests/chrome.rs
#             and firefox.rs. WebKit isn't automated (45-web-platform.md, "Open questions"), so nothing
#             claims it.
#   design    the design topic (below docs/design), with `#heading` where one section decides it
#   guide     the book page that teaches it, relative to docs/book/src
#   feature   for a planned row tracked by k_sema::features, the feature's id
#   note      one line: gaps, engine differences, why not

# Runtime files that wrap no browser API an app reaches through the stdlib: the renderer, the server
# half, codecs and plumbing. A file that touches a browser API only as part of rendering belongs here.
[internal]
"app.js" = "the server half of a generated app"
"crypto-ops.js" = "hands the server's Rust crypto ops to crypto.js"
"db.js" = "the server's database half of repositories"
"devtools.js" = "the k dev inspector's hooks"
"dom.js" = "the renderer's DOM operations"
"forms.js" = "@Form state and validation; focusing the first invalid field uses refs.js"
"hydrate.js" = "hydrating server-rendered HTML"
"index.js" = "the client runtime's exports"
"keycodec.js" = "the Codable codec of a P-256 public key, without the crypto chunk"
"list.js" = "keyed list rendering"
"load.js" = "@Load state"
"remote.js" = "rpc calls between the services of one system, on the server"
"rpc.js" = "the rpc client, over fetch; apps call protocols, not fetch"
"server.js" = "the JavaScript half of the server runtime"
"signals.js" = "reactivity"
"ssr.js" = "server rendering"
"store.js" = "path stores for @State structs"
"values.js" = "K's value representation"
"view.js" = "helpers of generated view code, the document title among them"

