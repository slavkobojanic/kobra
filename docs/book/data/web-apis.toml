[[area]]
name = "Workers and scheduling"
guide = "apps/workers.md"

[[area.api]]
name = "Web Workers"
status = "supported"
k = ["k.concurrency.Worker", "k.concurrency.WorkerFailure"]
side = "client"
runtime = ["workers.js"]
chromium = ["a_worker_counts_off_the_main_thread_and_stops_when_cancelled_in_chrome", "a_worker_throws_typed_errors_and_restarts_after_a_crash_in_chrome", "notes_ranks_the_filtered_notes_in_a_worker_in_chrome"]
design = "55-workers.md"
note = "A stateless service whose async methods run in a module worker; a cancelled call ends the worker and a crash restarts it."

[[area.api]]
name = "requestAnimationFrame, requestIdleCallback, scheduler.postTask"
status = "not-planned"
design = "45-web-platform.md#inventory"
note = "Runtime-internal: the renderer schedules."

[[area.api]]
name = "Performance timing, Web Vitals"
status = "planned"
tier = 2
design = "45-web-platform.md#inventory"
note = "In `k.observe`, reported to the app's own server, never to an analytics vendor."

