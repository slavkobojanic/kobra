design = "37-charts.md"
guide = "apps/charts.md"
note = "Charts are SVG, drawn on both sides for accessibility and server rendering; drawing of your own is `k.graphics`."

[[area.api]]
name = "Canvas 2D"
status = "planned"
tier = 2
feature = "k-graphics"
design = "45-web-platform.md#inventory"
