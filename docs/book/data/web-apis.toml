intro = "In the browser these use Web Crypto (`crypto.subtle`); on the server, and in both containers of `k test`, the same API runs on Rust ops (`ring`). The real-browser checks run the published test vectors and a differential against the server's backend."

[[area.api]]
name = "Web Crypto: AES-GCM"
status = "supported"
k = ["k.crypto.AesGcmKey", "k.crypto.Sealed", "k.crypto.WrappedKey"]
side = "both"
runtime = ["crypto.js"]
chromium = ["crypto_subtle_matches_the_vectors_and_the_ops_backend"]
firefox = ["crypto_subtle_matches_the_vectors_and_the_ops_backend_in_firefox"]
design = "33-crypto.md#authenticated-encryption-sealedt"
note = "AES-256-GCM only."

[[area.api]]
name = "Web Crypto: HMAC"
status = "supported"
k = ["k.crypto.Hmac", "k.crypto.Mac"]
side = "both"
runtime = ["crypto.js"]
design = "33-crypto.md#hmac-hmac-and-mac"
note = "SHA-256 and SHA-512."

[[area.api]]
name = "Web Crypto: SHA digests"
status = "supported"
k = ["k.crypto.Hash"]
side = "both"
runtime = ["crypto.js"]
design = "33-crypto.md#hashing"
note = "SHA-256 and SHA-512."

[[area.api]]
name = "Web Crypto: HKDF"
status = "supported"
k = ["k.crypto.Hkdf"]
side = "both"
runtime = ["crypto.js"]
chromium = ["crypto_subtle_matches_the_vectors_and_the_ops_backend"]
firefox = ["crypto_subtle_matches_the_vectors_and_the_ops_backend_in_firefox"]
design = "33-crypto.md#hkdf"
note = "HKDF-SHA256."

[[area.api]]
name = "Web Crypto: PBKDF2"
status = "supported"
k = ["k.crypto.PassphraseSalt", "k.crypto.AesGcmKey"]
side = "both"
runtime = ["crypto.js"]
design = "33-crypto.md#from-a-passphrase-pbkdf2"
note = "A key from a passphrase. Not in the vector check: Wycheproof has no PBKDF2 cases."

[[area.api]]
name = "Web Crypto: Ed25519"
status = "supported"
k = ["k.crypto.Ed25519PrivateKey", "k.crypto.Ed25519PublicKey", "k.crypto.Ed25519Signature"]
side = "both"
runtime = ["crypto.js"]
chromium = ["crypto_subtle_matches_the_vectors_and_the_ops_backend"]
firefox = ["crypto_subtle_matches_the_vectors_and_the_ops_backend_in_firefox"]
design = "33-crypto.md#signatures"
note = "The default signature. Browsers without Ed25519 in Web Crypto get no fallback."

[[area.api]]
name = "Web Crypto: ECDSA P-256"
status = "supported"
k = ["k.crypto.EcdsaP256PrivateKey", "k.crypto.EcdsaP256PublicKey", "k.crypto.EcdsaP256Signature"]
side = "both"
runtime = ["crypto.js"]
chromium = ["crypto_subtle_matches_the_vectors_and_the_ops_backend"]
firefox = ["crypto_subtle_matches_the_vectors_and_the_ops_backend_in_firefox"]
design = "33-crypto.md#decided-while-implementing"
note = "For interop (JWT ES256, VAPID). Gecko verified some signatures of the wrong length, so the binding refuses any that isn't 64 bytes first."

[[area.api]]
name = "Web Crypto: X25519 and HPKE"
status = "supported"
k = ["k.crypto.X25519PrivateKey", "k.crypto.X25519PublicKey", "k.crypto.SharedSecret", "k.crypto.Envelope", "k.crypto.EnvelopedKey"]
side = "both"
runtime = ["crypto.js"]
chromium = ["crypto_subtle_matches_the_vectors_and_the_ops_backend"]
firefox = ["crypto_subtle_matches_the_vectors_and_the_ops_backend_in_firefox"]
design = "33-crypto.md#sealing-to-a-public-key-envelopet"
note = "HPKE base mode (RFC 9180) is composed from Web Crypto calls; no primitive is written in JavaScript."

[[area.api]]
name = "Web Crypto: RSA"
status = "partial"
k = ["k.crypto.RsaPublicKey", "k.crypto.RsaSignature"]
side = "both"
runtime = ["crypto.js"]
design = "33-crypto.md#signatures"
note = "Verification only (PKCS #1 v1.5 and PSS), for tokens from identity providers; K never signs or encrypts with RSA."

[[area.api]]
name = "Crypto: getRandomValues, randomUUID"
status = "supported"
k = ["k.crypto.SecureRandom", "k.crypto.Uuid"]
side = "both"
runtime = ["crypto.js"]
design = "33-crypto.md#secure-random-values"

[[area.api]]
name = "Non-extractable keys kept in IndexedDB"
status = "supported"
k = ["k.crypto.KeyStore"]
side = "client"
runtime = ["crypto.js"]
chromium = ["crypto_key_store_keeps_a_non_extractable_key_across_a_reload", "notes_keeps_a_private_note_sealed_in_the_vault"]
design = "33-crypto.md#keeping-keys-in-the-browser-keystore"
note = "Not run on Firefox, where asking for persistent storage prompts and a headless run can't answer."

# ---------------------------------------------------------------------------------------------------

[[area]]
name = "Identity and payments"

[[area.api]]
name = "Web Authentication (passkeys)"
status = "supported"
k = ["k.auth.Passkeys", "k.auth.PasskeyVerifier"]
side = "both"
runtime = ["passkeys.js"]
chromium = ["passkeys_sign_up_and_in_with_a_virtual_authenticator_in_chrome", "passkeys_refuse_a_page_on_another_origin_in_chrome"]
design = "51-passkeys.md"
guide = "apps/auth.md"
note = "Attestation \"none\", verified by the server; registering and signing in need a user's action, as Safari requires. Autofill (conditional mediation) isn't built."

[[area.api]]
name = "Credential Management: stored passwords"
status = "not-planned"
design = "45-web-platform.md#inventory"
note = "The autocomplete attributes of form fields already cover it."

[[area.api]]
name = "Payment Request API"
status = "not-planned"
design = "45-web-platform.md#inventory"
note = "Every payment method needs a payment processor or merchant account; vendor integrations are packages."

