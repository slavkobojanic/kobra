# rpc.lock: generated by `k build`; commit it. The shape of every protocol
# this app serves (docs/design/40-workspaces-and-services.md).

[protocols."chat.ChatProtocol"]
service = "huddle.chat.ChatProtocol"

[protocols."chat.ChatProtocol".rpcs.history]
params = [{ name = "id", type = "Int" }]
returns = "List<String>"
throws = "RpcOnlyError"

[protocols."chat.ChatProtocol".rpcs.room]
kind = "channel"
params = [{ name = "id", type = "Int" }]
send = "String"
receive = "String"
refusal = "RpcOnlyError"
throws = "RpcOnlyError"
