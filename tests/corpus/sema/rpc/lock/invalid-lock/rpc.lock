# rpc.lock: generated by `k build`; commit it. The shape of every protocol
# this app serves (docs/design/40-workspaces-and-services.md).

[protocols."cart.CartApi"]

[protocols."cart.CartApi".rpcs.add]
params = [{ name = "item", type = "cart.CartItem" }]
returns = "Int"
throws = "cart.CartError"

[protocols."cart.CartApi".rpcs.clear]
params = []
returns = "Void"
throws = "cart.CartError"

[types."cart.CartError"]
cases = ["outOfStock", "rpcFailure"]

[types."cart.CartItem"]
fields = [
    { name = "productId", type = "Int", number = 1 },
    { name = "quantity", type = "Int", number = 1 },
]
