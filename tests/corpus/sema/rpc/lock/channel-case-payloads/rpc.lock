# rpc.lock: generated by `k build`; commit it. The shape of every protocol
# this app serves (docs/design/40-workspaces-and-services.md).

[protocols."chat.ChatProtocol"]
service = "huddle.chat.ChatProtocol"

[protocols."chat.ChatProtocol".rpcs.room]
kind = "channel"
params = [{ name = "id", type = "Int" }]
send = "chat.ChatCommand"
receive = "chat.ChatEvent"
refusal = "chat.CommandError"
throws = "chat.RoomError"

[types."chat.ChatCommand"]
cases = [
    { name = "post", fields = [{ name = "text", type = "String" }] },
    { name = "pin", fields = [{ name = "id", type = "Int" }] },
    { name = "edit", fields = [{ name = "id", type = "Int" }, { name = "text", type = "String" }] },
    { name = "typing" },
]

[types."chat.ChatEvent"]
cases = [
    { name = "snapshot", fields = [{ name = "messages", type = "List<chat.Message>" }] },
    { name = "posted", fields = [{ name = "_0", type = "chat.Message" }] },
    { name = "deleted", fields = [{ name = "_0", type = "Int" }] },
    { name = "cleared", fields = [{ name = "by", type = "Int" }] },
]

[types."chat.CommandError"]
cases = [
    { name = "notYours", fields = [{ name = "author", type = "Int" }] },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]

[types."chat.Member"]
fields = [
    { name = "name", type = "String", number = 1 },
]

[types."chat.Message"]
fields = [
    { name = "text", type = "String", number = 1 },
]

[types."chat.RoomError"]
cases = [
    { name = "notAMember" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]
