# A library ships fonts with its theme's `FontFace`s, each a file of the
# library itself (07-themes-and-units.md, "Shipped fonts"): a missing file
# or one outside the package is K3308 (with the closest font file as a fix),
# a file that isn't WOFF2 or WOFF is K3309, two files for one family, weight
# and style are K3310 (across packages too), a weight outside 1–1000 is
# K2404, and a `FontFace` outside a theme's font token is K3311.
[workspace]
members = ["brand", "site"]
