# rpc.lock: generated by `k build`; commit it. The shape of every protocol
# this app serves (docs/design/40-workspaces-and-services.md).

[protocols."ledger.LedgerProtocol"]
service = "ledger.LedgerProtocol"

[protocols."ledger.LedgerProtocol".rpcs.balance]
params = [{ name = "account", type = "String" }]
returns = "ledger.Balance"
throws = "ledger.BalanceError"

[types."ledger.Balance"]
fields = [
    { name = "account", type = "String", number = 1 },
    { name = "cents", type = "Int", number = 2 },
    { name = "note", type = "String?", number = 3 },
]

[types."ledger.BalanceError"]
cases = [
    { name = "unknownAccount", fields = [{ name = "name", type = "String" }] },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]
