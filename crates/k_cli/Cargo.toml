[package]
name = "k_cli"
# Integration tests are modules of tests/main.rs (one binary, `it`), not one
# binary per file: docs/design/13-tooling.md, "One test binary per crate".
autotests = false
description = "The `k` command-line tool: compiler, test runner and development server of the K language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "k"
path = "src/main.rs"

[dependencies]
k_diagnostics.workspace = true
k_syntax.workspace = true
k_sema.workspace = true
k_codegen.workspace = true
# `k migrate status` reads `k_migrations` directly.
k_db.workspace = true
# `k lsp`: the language server, over the same analysis as `k check`.
k_lsp.workspace = true
k_server = { workspace = true, optional = true }
# `k dev` waits for a signal or a source change (server builds only).
tokio = { workspace = true, optional = true }
# The golden-file formats (`.diag` rendering for `k debug diag`). Only the
# library part is used; it has no test-only dependencies.
k_corpus.workspace = true
clap.workspace = true
# `k test` reads the results of the test run (JSON) from the isolate.
serde_json.workspace = true

[dev-dependencies]
# tests/lsp.rs speaks the protocol to `k lsp`.
lsp-types.workspace = true
k_server.workspace = true
flate2.workspace = true
k_runtime.workspace = true
tokio.workspace = true
# tests/deploy.rs reads the shop's docker-compose.yml and Kubernetes
# manifests.
yaml-rust2.workspace = true
# tests/debugging.rs decodes the source maps Chrome is given.
sourcemap.workspace = true
# tests/examples.rs talks to huddle's channels over a raw WebSocket.
tungstenite.workspace = true

[features]
# The server runtime (V8). On by default; `--no-default-features` builds a
# compiler-only `k` without V8, for fast compiler development.
default = ["server"]
server = ["dep:k_server", "dep:tokio"]

[[test]]
name = "it"
path = "tests/main.rs"

[lints]
workspace = true
