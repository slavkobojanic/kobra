[package]
name = "k_corpus"
# Integration tests are modules of tests/main.rs (one binary, `it`), not one
# binary per file: docs/design/13-tooling.md, "One test binary per crate".
autotests = false
description = "Golden corpus test harness for the K toolchain (tests/corpus)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
k_diagnostics.workspace = true
k_syntax.workspace = true
k_sema.workspace = true
k_codegen.workspace = true
serde_json.workspace = true

[dev-dependencies]
libtest-mimic.workspace = true

[[test]]
name = "it"
path = "tests/main.rs"

[[test]]
name = "corpus"
path = "tests/corpus.rs"
harness = false

[lints]
workspace = true
