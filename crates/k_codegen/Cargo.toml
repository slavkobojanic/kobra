[package]
name = "k_codegen"
description = "JavaScript and CSS code generation for K, with the client/server bundle split."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The library's unit tests are not benchmarks (see k_sema's Cargo.toml).
[lib]
bench = false

[dependencies]
k_diagnostics.workspace = true
k_sema.workspace = true
k_syntax.workspace = true
rowan.workspace = true
k_runtime.workspace = true
k_db.workspace = true
serde.workspace = true
serde_json.workspace = true
# `routes.lock` is TOML (`routelock.rs`).
toml.workspace = true
# Release builds minify and tree-shake the client chunks (`minify.rs`).
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
oxc_syntax.workspace = true
oxc_minifier.workspace = true
oxc_codegen.workspace = true

[dev-dependencies]
sourcemap.workspace = true
flate2.workspace = true
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "codegen"
harness = false

[lints]
workspace = true
