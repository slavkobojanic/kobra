[package]
name = "k_sema"
# Integration tests are modules of tests/main.rs (one binary, `it`), not one
# binary per file: docs/design/13-tooling.md, "One test binary per crate".
autotests = false
description = "Semantic analysis for Kobra: modules, name resolution, types and the language's static rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# The standard library's Kobra sources (stdlib/**/*.k) are embedded with
# include_str!; `cargo package` would need them listed, but the workspace
# is not published.

# The library's unit tests are not benchmarks; without this, `cargo bench
# -p k_sema -- <criterion options>` would pass the options to the libtest
# harness, which rejects them.
[lib]
bench = false

[dependencies]
k_diagnostics.workspace = true
k_syntax.workspace = true
rowan.workspace = true
# `storage.lock` is TOML (the lockfile checks, `locks.rs`).
toml.workspace = true

[dev-dependencies]
proptest.workspace = true
# tests/book.rs: the patterns of docs/book/check/stale.txt.
regex.workspace = true
arbitrary.workspace = true
criterion.workspace = true

[[test]]
name = "it"
path = "tests/main.rs"

[[bench]]
name = "sema"
harness = false

[lints]
workspace = true
