[package]
name = "k_sema"
description = "Semantic analysis for K: modules, name resolution, types and the language's static rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The standard library's K sources (stdlib/**/*.k) are embedded with
# include_str!; `cargo package` would need them listed, but the workspace
# is not published.

# The library's unit tests are not benchmarks; without this, `cargo bench
# -p k_sema -- <criterion options>` would pass the options to the libtest
# harness, which rejects them.
[lib]
bench = false

[dependencies]
k_diagnostics.workspace = true
k_syntax.workspace = true
rowan.workspace = true

[dev-dependencies]
proptest.workspace = true
arbitrary.workspace = true
criterion.workspace = true

[[bench]]
name = "sema"
harness = false

[lints]
workspace = true
