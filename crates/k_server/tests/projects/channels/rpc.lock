# rpc.lock: generated by `k build`; commit it. The shape of every protocol
# this app serves (docs/design/40-workspaces-and-services.md).

[protocols."chat.ChatProtocol"]
service = "chans.chat.ChatProtocol"

[protocols."chat.ChatProtocol".rpcs.announce]
params = [{ name = "room", type = "String" }, { name = "text", type = "String" }]
returns = "Void"
throws = "RpcOnlyError"

[protocols."chat.ChatProtocol".rpcs.members]
kind = "channel"
params = [{ name = "id", type = "String" }]
send = "chat.ChatCommand"
receive = "chat.ChatEvent"
refusal = "chat.CommandError"
throws = "chat.RoomError"

[protocols."chat.ChatProtocol".rpcs.notes]
params = []
returns = "List<String>"
throws = "RpcOnlyError"

[protocols."chat.ChatProtocol".rpcs.pair]
kind = "channel"
params = [{ name = "first", type = "String" }, { name = "second", type = "String" }]
send = "chat.ChatCommand"
receive = "chat.ChatEvent"
refusal = "chat.CommandError"
throws = "chat.RoomError"

[protocols."chat.ChatProtocol".rpcs.room]
kind = "channel"
params = [{ name = "id", type = "String" }]
send = "chat.ChatCommand"
receive = "chat.ChatEvent"
refusal = "chat.CommandError"
throws = "chat.RoomError"

[protocols."chat.ChatProtocol".rpcs.signIn]
params = [{ name = "name", type = "String" }]
returns = "Void"
throws = "RpcOnlyError"

[protocols."chat.ChatProtocol".rpcs.signOut]
params = []
returns = "Void"
throws = "RpcOnlyError"

[types."chat.ChatCommand"]
cases = ["post", "refuse", "count", "whoami"]

[types."chat.ChatEvent"]
cases = ["snapshot", "posted", "count", "user"]

[types."chat.CommandError"]
cases = ["notAllowed", "rpcFailure"]

[types."chat.RoomError"]
cases = ["closed", "rpcFailure"]
