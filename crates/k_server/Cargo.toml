[package]
name = "k_server"
# Integration tests are modules of tests/main.rs (one binary, `it`), not one
# binary per file: docs/design/13-tooling.md, "One test binary per crate".
autotests = false
description = "The K server runtime: embedded V8 via deno_core, HTTP via hyper, RPC dispatch and server-side rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
k_runtime.workspace = true
k_db.workspace = true
deno_core.workspace = true
deno_error.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
argon2.workspace = true
ring.workspace = true
x25519-dalek.workspace = true
p256.workspace = true
hyper-rustls.workspace = true
lettre.workspace = true
sha2.workspace = true
rustls.workspace = true
# `@Matches` constraints of config fields, checked at startup.
regex.workspace = true
# Stack traces mapped to `.k` lines through the bundle's maps (`stack.rs`).
sourcemap.workspace = true
# The channels' WebSocket front (`sockets.rs`) and outgoing WebSockets
# (`websocket.rs`).
tokio-tungstenite.workspace = true
futures-util.workspace = true
tower-service.workspace = true

[lints]
workspace = true

[dev-dependencies]
libtest-mimic.workspace = true
tokio = { workspace = true, features = ["rt"] }
k_corpus.workspace = true
k_sema.workspace = true
k_codegen.workspace = true
# The compat suite's lockfile diagnostics (`tests/compat/locks.rs`).
k_diagnostics.workspace = true
proptest.workspace = true
arbitrary.workspace = true
toml.workspace = true
# The raw WebSocket client of the channel tests (`tests/channel_server.rs`).
tungstenite.workspace = true

[[test]]
name = "it"
path = "tests/main.rs"

[[test]]
name = "runtime_js"
path = "tests/runtime_js.rs"
harness = false

[[test]]
name = "corpus_run"
path = "tests/corpus_run.rs"
harness = false

[[test]]
name = "e2e"
path = "tests/e2e.rs"
harness = false

