[package]
name = "k_lsp"
# Integration tests are modules of tests/main.rs (one binary, `it`), not one
# binary per file: docs/design/13-tooling.md, "One test binary per crate".
autotests = false
description = "The Kobra language server: the compiler's analysis engine behind the Language Server Protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# The library's unit tests are not benchmarks (see k_sema).
[lib]
bench = false

[dependencies]
k_diagnostics.workspace = true
k_syntax.workspace = true
k_sema.workspace = true
# `textDocument/formatting`.
k_fmt.workspace = true
rowan.workspace = true
# The protocol's types only; the transport (framing, dispatch, threads,
# cancellation) is our own (docs/compiler/lsp.md, "Dependencies").
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true
arbitrary.workspace = true
# Evaluates the TextMate grammar's patterns in tests/editors.rs and tests/textmate.rs.
regex.workspace = true

[[test]]
name = "it"
path = "tests/main.rs"

[lints]
workspace = true
