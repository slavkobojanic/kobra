[package]
name = "k_lsp"
description = "The K language server: the compiler's analysis engine behind the Language Server Protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The library's unit tests are not benchmarks (see k_sema).
[lib]
bench = false

[dependencies]
k_diagnostics.workspace = true
k_syntax.workspace = true
k_sema.workspace = true
rowan.workspace = true
# The protocol's types only; the transport (framing, dispatch, threads,
# cancellation) is our own (docs/compiler/lsp.md, "Dependencies").
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true
arbitrary.workspace = true
# Evaluates the TextMate grammar's patterns in tests/textmate.rs.
regex.workspace = true

[lints]
workspace = true
