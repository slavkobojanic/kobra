[package]
name = "k_runtime"
# Integration tests are modules of tests/main.rs (one binary, `it`), not one
# binary per file: docs/design/13-tooling.md, "One test binary per crate".
autotests = false
description = "The hand-written JavaScript runtime of K (signals, DOM renderer, hydration, router, RPC client), embedded in the k binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]

[dev-dependencies]
flate2.workspace = true

[[test]]
name = "it"
path = "tests/main.rs"

[lints]
workspace = true
