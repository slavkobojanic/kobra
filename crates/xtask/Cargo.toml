[package]
name = "xtask"
# Integration tests are modules of tests/main.rs (one binary, `it`):
# docs/design/13-tooling.md, "One test binary per crate".
autotests = false
description = "Release automation for the Kobra repository (`cargo xtask …`): changelog fragments, version bumps, the local gate, the docs gate, the docs site and the release artifacts. A workspace member that is never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# A fragment's `migration:` must be a code `k upgrade` applies
# (`codes::MIGRATIONS`).
k_diagnostics.workspace = true
clap.workspace = true
# The release archives (`dist`): gzip and deflate, SHA-256, index.json.
flate2.workspace = true
sha2.workspace = true
serde_json.workspace = true
# Reading the CI workflows back (`workflows`), as k_cli reads Compose files.
yaml-rust2.workspace = true

[[test]]
name = "it"
path = "tests/main.rs"

[lints]
workspace = true
