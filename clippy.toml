# Clippy configuration for the Kobra toolchain.
#
# Production code must never panic on user input (see
# docs/compiler/architecture.md, "Diagnostics"), so `unwrap_used` and `panic`
# are warnings in the workspace lints. Tests may unwrap and panic freely.
# Lints target the same Rust as Cargo.toml `rust-version` (1.97, which
# k_codegen's minifier, oxc, needs); keep the two in step.
msrv = "1.97"
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
too-many-lines-threshold = 200
