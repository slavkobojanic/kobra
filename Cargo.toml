# The K toolchain workspace.
#
# Every crate lives under `crates/`. The layout, the responsibilities of each
# crate and the dependency rules between them are documented in
# `docs/compiler/architecture.md`, which is the source of truth.

[workspace]
resolver = "3"
members = ["crates/*"]
# The fuzz targets need a nightly toolchain and `cargo fuzz`; they are kept
# out of the stable workspace build. See docs/compiler/testing.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
# Internal crates.
k_diagnostics = { path = "crates/k_diagnostics" }
k_syntax = { path = "crates/k_syntax" }
k_sema = { path = "crates/k_sema" }
k_codegen = { path = "crates/k_codegen" }
k_runtime = { path = "crates/k_runtime" }
k_server = { path = "crates/k_server" }
k_db = { path = "crates/k_db" }
k_corpus = { path = "crates/k_corpus" }
k_lsp = { path = "crates/k_lsp" }

# External crates. Keep this list short; every addition needs a reason in
# docs/compiler/architecture.md ("Dependencies").
rowan = "0.17"
text-size = "1.1"
clap = { version = "4.6", features = ["derive"] }
libtest-mimic = "0.8"
criterion = { version = "0.8", default-features = false }
proptest = "1.12"
arbitrary = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
deno_core = "0.413"
deno_error = "0.7"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "net", "macros", "sync", "time", "signal", "io-util"] }
hyper = { version = "1.10", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1", "server-graceful"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "webpki-roots"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder"] }
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
http-body-util = "0.1"
bytes = "1"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache", "collation"] }
tokio-postgres = "0.7"
flate2 = "1.1"
toml = { version = "1.2", default-features = false, features = ["std", "parse", "serde"] }
getrandom = "0.4"
argon2 = "0.5"
lsp-types = "0.95.1"
regex = { version = "1.11", default-features = false, features = ["std", "unicode-perl"] }
yaml-rust2 = { version = "0.13", default-features = false }
# The release-build JavaScript minifier (k_codegen `minify.rs`), pinned
# exactly: its output is part of every content hash.
oxc_allocator = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_parser = "=0.155.0"
oxc_span = "=0.155.0"
oxc_syntax = "=0.155.0"
oxc_minifier = "=0.155.0"
oxc_codegen = "=0.155.0"
# Source maps: deno_core maps server stack traces with it (already in the
# tree through deno_core), k_server symbolicates logged traces, and the
# codegen tests decode the generated maps with it as an independent check.
sourcemap = "=9.3.2"
# The channels' WebSocket (k_server `sockets.rs`, docs/design/44-channels.md):
# the server's framing over hyper's upgraded connection, and the tests' raw
# client. Pinned exactly, like every protocol implementation the wire
# depends on.
tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
panic = "warn"
print_stderr = "allow"

[profile.release]
codegen-units = 1
lto = "thin"

[profile.bench]
debug = true

# Tests and `cargo run` use the dev profile (docs/compiler/testing.md,
# "Running tests fast"). Third-party crates are built optimized: they
# rebuild only when Cargo.lock changes, and unoptimized argon2 and SQLite
# made `k test examples/shop` take 14.5 s instead of 2.8 s. The workspace's
# crates get `opt-level = 1`: the suite runs about 1.8x faster than at 0,
# and rebuilding after an edit is no slower (the link dominates). Debug
# info stays full.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
