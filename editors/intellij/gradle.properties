# The plugin's version: the workspace version (`[workspace.package] version`
# in the repository's Cargo.toml). crates/k_cli/tests/version.rs checks they
# agree, and `cargo xtask release prepare` moves both.
pluginVersion = 0.1.0-rc.2

# The IntelliJ Platform the plugin is built and tested against, and the
# oldest it supports (2026.2: the platform's LSP API with rename and the
# LspIntegrationProvider names; docs/design/13-tooling.md, "JetBrains IDEs").
platformVersion = 2026.2.5
sinceBuild = 262

# The IDE provides the Kotlin standard library.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
