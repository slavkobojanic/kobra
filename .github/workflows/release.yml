# A release, started by hand with its version (docs/compiler/release.md §6,
# §7 and §9, "release.yml"; design 48, "CI on request"):
#
#   gh workflow run release.yml -f version=0.6.0-rc.1                    # from main
#   gh workflow run release.yml --ref release/0.6 -f version=0.6.0       # from a release branch
#   gh run watch
#
# The version must already be prepared on that branch (`cargo xtask release
# prepare <version>`, committed and pushed) and not tagged: `check` refuses
# it otherwise, with the command to run. Then the whole gate on the
# dispatched commit, the Linux and Windows archives with their smoke tests,
# the book (docs-<version>.tar.gz), SHA256SUMS, signatures and provenance,
# (each archive's Sigstore bundle, `k-*.sigstore.json`), the extension, the
# JetBrains plugin, the toolchain image, the whole toolchain index, and, only
# when all of that passed, `release`: the annotated tag v<version> on that
# commit, pushed, and the GitHub release (a draft unless `-f draft=false`,
# a pre-release for a version with a pre-release part). No job runs on
# macOS (design 48, "Private distribution", kept when the repository went
# public): the release manager builds the macOS archive and attaches it with
# `cargo xtask release attach-local v<version>`, then publishes with
# `gh workflow run publish.yml -f version=<version>` (release.md §6).
#
# Pushing the toolchain images needs K_PUBLISH_ENABLED, and the
# performance job a runner named by K_PERF_RUNNER.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, prepared on the branch: 0.6.0 or 0.6.0-rc.1"
        required: true
        type: string
      draft:
        description: "Make the release a draft (publish it with publish.yml after attaching the macOS archive)"
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The project's toolchain image (Cargo.toml's [workspace.metadata.project];
  # crates/k_cli/tests/version.rs checks they agree).
  K_IMAGE: ghcr.io/slavkobojanic/kobra

jobs:
  # ---- The version ----------------------------------------------------------

  # The input is a version, the checkout's (prepared, with its CHANGELOG.md
  # section) and not tagged yet; every later job reads it from here.
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      minor: ${{ steps.v.outputs.minor }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache: lint
      - id: v
        run: cargo xtask ci check-version "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

  # ---- The gate, on the dispatched commit -------------------------------------------------

  gate-test:
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          mdbook: "true"
      - shell: bash
        run: cargo test --workspace --no-fail-fast
      - shell: bash
        run: "cargo test -p k_cli --test it -- install_script::"

  gate-services:
    needs: [check]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: k
          POSTGRES_DB: k_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # stage3_server runs the `k` binary itself.
      - run: cargo build -p k_cli
      - run: cargo test -p k_db -p k_server
        env:
          K_TEST_POSTGRES_URL: postgres://postgres:k@127.0.0.1:5432/k_test
      - run: "cargo test -p k_cli --test it -- chrome:: dist_browser::"
        env:
          K_REQUIRE_CHROME: "1"

  # Formatting, lints, the book and the site, the compatibility fixtures,
  # the versions, and the fragments (none may be left on a release).
  gate-checks:
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          mdbook: "true"
          cache: book
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The Kobra code of the examples in `k fmt`'s canonical form (a compiler-only
      # `k`, without V8).
      - run: cargo run -p k_cli --no-default-features --bin k -- fmt --check examples
      # A release leaves no fragment; a candidate keeps them (`release
      # prepare` deletes them only for the release).
      - if: needs.check.outputs.prerelease != 'true'
        run: cargo xtask fragments --none-left
      - if: needs.check.outputs.prerelease == 'true'
        run: cargo xtask fragments
      - run: "cargo test -p k_cli --test it -- version::"
      - run: cargo test -p xtask
      - run: "cargo test -p k_server --test it -- compat::"
      - run: cargo xtask docs build --version "${{ needs.check.outputs.version }}" --out target/site

  # A shorter property run than the nightly's.
  gate-properties:
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: release
      - run: "cargo test --release -p k_sema --test it -- properties::"
        env:
          PROPTEST_CASES: "1000"
      - run: "cargo test -p k_syntax --test it -- properties::"
        env:
          PROPTEST_CASES: "5000"
      - run: "cargo test -p k_server --test it -- differential:: --test-threads=4"
        env:
          PROPTEST_CASES: "200"

  # Each fuzz target over its seeds, with no new inputs. fuzz/corpus is
  # git-ignored, so fuzz/seed-corpus.sh first fills it from committed files
  # (tests/corpus, fuzz/seeds).
  gate-fuzz:
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        target: [lex, parse, parse_roundtrip, structured, check, check_structured, check_typed, codegen, codegen_run, rpc_json, http_request, lsp_edits]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          toolchain: nightly
          cache: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: fuzz/seed-corpus.sh
      # Fuzzing looks for crashes; one-time allocations still held at exit
      # (lazy statics, V8) aren't leaks worth failing a release over.
      - run: cargo +nightly fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- -runs=0 -detect_leaks=0
        env:
          ASAN_OPTIONS: detect_leaks=0

  # On the performance runner (K_PERF_RUNNER); without one the release
  # manager runs it by hand and records the numbers (release.md §6).
  gate-perf:
    if: vars.K_PERF_RUNNER != ''
    needs: [check]
    runs-on: ${{ vars.K_PERF_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: perf
      - run: scripts/bench-check.sh

  # ---- The artifacts --------------------------------------------------------

  # A release build per target on its native runner, `--locked`; Linux in
  # Debian 11 for the glibc 2.31 baseline. macOS is built on the release
  # manager's Mac (`cargo xtask release attach-local`).
  build:
    needs: [check, gate-test, gate-services, gate-checks, gate-properties, gate-fuzz]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, container: "rust:bullseye" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, container: "rust:bullseye" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: release-${{ matrix.target }}
      - shell: bash
        run: rustup target add ${{ matrix.target }}
      - shell: bash
        run: cargo build --release -p k_cli --locked --target ${{ matrix.target }}
      - shell: bash
        run: cargo xtask dist archive --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: target/dist

  # On a fresh runner of each target: unpack the archive as a user would,
  # then `k new`, `k check`, `k test`, `k build`, `dist/app serve` and
  # `dist/app probe`.
  smoke:
    needs: [check, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, exe: k }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, exe: k }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: target/dist
      - shell: bash
        run: mkdir -p target/unpacked
      - if: runner.os != 'Windows'
        run: tar -xzf target/dist/k-*.tar.gz -C target/unpacked
      - if: runner.os == 'Windows'
        shell: bash
        run: unzip -q target/dist/k-*.zip -d target/unpacked
      - shell: bash
        run: cargo xtask dist smoke --k target/unpacked/k-*/${{ matrix.exe }}

  # SHA256SUMS over the archives and the book, and this release's index
  # entry (with the book as `docs`).
  checksums:
    needs: [check, build, docs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: target/dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: book
          path: target/dist
      - run: cargo xtask dist checksums target/dist
      - run: cargo xtask dist index target/dist --index target/dist/index-entry.json --download "${{ github.server_url }}/${{ github.repository }}/releases/download"
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: |
            target/dist/SHA256SUMS
            target/dist/index-entry.json

  # Sigstore keyless signatures and build provenance for every archive.
  sign:
    needs: [check, checksums]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: target/dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - run: scripts/ci/sign.sh target/dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/dist/k-*
      - uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: target/dist/*.sigstore.json

  # Downloads the artifacts as a user would and checks digests and
  # signatures, against this workflow's identity at the ref it was started
  # on (`refs/heads/main`, or the release branch).
  verify:
    needs: [check, sign, docs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: target/dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: book
          path: target/dist
      - uses: actions/download-artifact@v4
        with:
          name: checksums
          path: target/dist
      - uses: actions/download-artifact@v4
        with:
          name: signatures
          path: target/dist
      - uses: sigstore/cosign-installer@v3
      - run: scripts/ci/verify.sh target/dist "${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"

  # The VS Code extension, kobra-<version>.vsix (npm runs here only).
  extension:
    needs: [check, gate-checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: editors/vscode
      - run: node --test
        working-directory: editors/vscode
      - run: mkdir -p target/dist
      - run: npx --yes @vscode/vsce@3 package --out ../../target/dist/
        working-directory: editors/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: target/dist/*.vsix

  # The JetBrains plugin, kobra-intellij-<version>.zip: tested in a headless
  # IDE and checked by the plugin verifier first (no npm; Gradle through its
  # wrapper).
  intellij:
    needs: [check, gate-checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: ./gradlew --no-daemon --console=plain test buildPlugin verifyPlugin
        working-directory: editors/intellij
      - run: mkdir -p target/dist
      - run: cp "editors/intellij/build/distributions/kobra-$VERSION.zip" "target/dist/kobra-intellij-$VERSION.zip"
        env:
          VERSION: ${{ needs.check.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: intellij-plugin
          path: target/dist/kobra-intellij-*.zip

  # The toolchain image per architecture, checked by building examples/shop
  # with it; pushed under `<version>-<arch>` with K_PUBLISH_ENABLED (the
  # multi-arch `<version>` tag is made by publish.yml).
  image:
    needs: [check, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: target/dist
      - run: mkdir -p target/image
      - run: tar -xzf target/dist/k-${{ needs.check.outputs.version }}-${{ matrix.target }}.tar.gz -C target/image --strip-components 1
      - run: docker build --file docker/toolchain.Dockerfile --tag "${{ env.K_IMAGE }}:${{ needs.check.outputs.version }}-${{ matrix.arch }}" target/image
      - run: docker build --file examples/shop/Dockerfile --build-arg "K_TOOLCHAIN=${{ env.K_IMAGE }}:${{ needs.check.outputs.version }}-${{ matrix.arch }}" --build-arg APP=shop --tag k-shop:ci .
      - if: vars.K_PUBLISH_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: vars.K_PUBLISH_ENABLED == 'true'
        run: docker push "${{ env.K_IMAGE }}:${{ needs.check.outputs.version }}-${{ matrix.arch }}"

  # The book of the release with the version substituted: for review, and
  # packed as docs-<version>.tar.gz, which the release attaches and the
  # installers unpack for `k docs`, the offline copy of the docs site's.
  docs:
    needs: [check, gate-checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          mdbook: "true"
          cache: book
      - run: cargo xtask docs build --version "${{ needs.check.outputs.version }}" --out target/site
      - run: cargo xtask dist docs "target/site/${{ needs.check.outputs.minor }}" --out target/dist
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: target/site
      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: target/dist/docs-*.tar.gz

  # Only when every job above passed (a skipped `gate-perf`, without a
  # performance runner, doesn't stop it; a failed one does): the annotated
  # tag v<version> on the dispatched commit, the one everything above ran
  # on, pushed (scripts/ci/tag.sh; a re-run finds it there and goes on,
  # another commit's tag is refused), then the GitHub release with the
  # notes from CHANGELOG.md, every archive, the book, SHA256SUMS, the index
  # entry, the whole index (every published release's entry and this
  # one's), the signatures, the .vsix and the JetBrains plugin's zip:
  # everything `cargo xtask release attach-local` merges the macOS archive
  # into. A draft (by default) shows
  # nothing until `publish.yml` publishes it.
  release:
    if: ${{ !cancelled() && !failure() }}
    needs: [check, smoke, verify, extension, intellij, image, docs, gate-perf]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: target/dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: checksums
          path: target/dist
      - uses: actions/download-artifact@v4
        with:
          name: signatures
          path: target/dist
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: target/dist
      - uses: actions/download-artifact@v4
        with:
          name: intellij-plugin
          path: target/dist
      - uses: actions/download-artifact@v4
        with:
          name: book
          path: target/dist
      - run: scripts/ci/release-index.sh target/dist/index.json target/dist/index-entry.json
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cargo xtask ci notes "${{ needs.check.outputs.tag }}" --out target/notes.md --links "${{ github.server_url }}/${{ github.repository }}/blob/${{ needs.check.outputs.tag }}"
      - run: scripts/ci/tag.sh "${{ needs.check.outputs.tag }}" "${{ github.sha }}"
      - run: gh release create "$TAG" --verify-tag $DRAFT $PRERELEASE --title "Kobra $VERSION" --notes-file target/notes.md target/dist/k-* target/dist/docs-*.tar.gz target/dist/SHA256SUMS target/dist/index-entry.json target/dist/index.json target/dist/*.vsix target/dist/kobra-intellij-*.zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          DRAFT: ${{ inputs.draft && '--draft' || '' }}
          PRERELEASE: ${{ needs.check.outputs.prerelease == 'true' && '--prerelease' || '' }}
