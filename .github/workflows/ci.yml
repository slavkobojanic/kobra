# Every pull request, and every push to main or a release branch
# (docs/compiler/release.md §9, "ci.yml"). Each step is a command that also
# runs locally.
#
# Off until the owner switches it on: every job runs only when the
# repository variable K_CI_ENABLED is `true`, and the Pages deploy also
# needs K_PAGES_ENABLED (release.md §9, "Switching CI on").
name: ci

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    if: vars.K_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    if: vars.K_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: k
          POSTGRES_DB: k_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          mdbook: "true"
      # The full suite: the book's snippets, the generated references, the
      # examples, version consistency, the fragments, the compatibility
      # fixtures; the database tests also on Postgres, the browser tests in
      # the runner's Chrome (which must be found).
      - run: cargo test --workspace
        env:
          K_TEST_POSTGRES_URL: postgres://postgres:k@127.0.0.1:5432/k_test
          K_REQUIRE_CHROME: "1"

  test-macos:
    if: vars.K_CI_ENABLED == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          mdbook: "true"
      - run: cargo test --workspace

  book:
    if: vars.K_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          mdbook: "true"
          cache: book
      # The book with no mdBook warning, as the versioned site /next/.
      - run: cargo xtask docs build --version next --out target/site
      - run: "cargo test -p k_sema --test it -- book_links::"
      - id: changed
        run: cargo xtask ci changed --base "${{ github.event.pull_request.base.sha || github.event.before }}" docs/book/ crates/xtask/
      # The pull request's preview: the built site as an artifact (until
      # the owner picks a host with previews).
      - if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: target/site
          retention-days: 14

  fragments:
    if: vars.K_CI_ENABLED == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache: lint
      - run: cargo test -p xtask
      # A fragment when crates/, editors/ or docs/book/ changed, and each
      # fragment's book pages in the diff.
      - run: cargo xtask docs-gate "${{ github.event.pull_request.base.sha }}"

  install-scripts:
    if: vars.K_CI_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: changed
        shell: bash
        run: cargo xtask ci changed --base "${{ github.event.pull_request.base.sha || github.event.before }}" scripts/install. crates/k_cli/tests/install_script.rs crates/k_cli/tests/support/release.rs
      # Each installer against a fake release served on loopback; the
      # PowerShell one runs where pwsh is (Windows).
      - if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: "cargo test -p k_cli --test it -- install_script::"

  # /next/ (and the newest release, the redirects, versions.json, the
  # install scripts and the index) on GitHub Pages after each push to main.
  pages:
    if: vars.K_CI_ENABLED == 'true' && vars.K_PAGES_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test-linux, test-macos, book]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          mdbook: "true"
          cache: book
      - uses: ./.github/actions/site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site
      - id: deploy
        uses: actions/deploy-pages@v4
