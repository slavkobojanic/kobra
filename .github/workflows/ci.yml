# The checks of a change, run only on request (docs/compiler/release.md §9,
# "ci.yml"; design 48, "CI on request"): from the Actions page, or
#
#   gh workflow run ci.yml --ref <branch>             # against origin/main
#   gh workflow run ci.yml --ref <branch> -f base=origin/release/0.6
#
# Nothing runs on a pull request or a push: the repository is private, where
# every minute is billed, and the owner starts each run. Each step is a
# command that also runs locally. The Pages deploy also needs
# K_PAGES_ENABLED (for the day the repository is public).
#
# Linux only: a macOS minute is billed at ten Linux minutes and a Windows
# minute at two (design 48, "Private distribution"). macOS is tested on the
# owner's Mac before each release (release.md §6), and Windows by the
# release's gate.
name: ci

on:
  workflow_dispatch:
    inputs:
      base:
        description: "The commit the change is compared with (the fragments, the docs gate, what changed)"
        type: string
        default: origin/main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The Kobra code of the examples in `k fmt`'s canonical form (a compiler-only
      # `k`, without V8).
      - run: cargo run -p k_cli --no-default-features --bin k -- fmt --check examples

  test-linux:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: k
          POSTGRES_DB: k_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          mdbook: "true"
      # The full suite: the book's snippets, the generated references, the
      # examples, version consistency, the fragments, the compatibility
      # fixtures; the database tests also on Postgres, the browser tests in
      # the runner's Chrome (which must be found).
      - run: cargo test --workspace
        env:
          K_TEST_POSTGRES_URL: postgres://postgres:k@127.0.0.1:5432/k_test
          K_REQUIRE_CHROME: "1"

  book:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          mdbook: "true"
          cache: book
      # The book with no mdBook warning, as the versioned site /next/.
      - run: cargo xtask docs build --version next --out target/site
      - run: "cargo test -p k_sema --test it -- book_links::"
      - id: changed
        run: cargo xtask ci changed --base "$BASE" docs/book/ crates/xtask/
        env:
          BASE: ${{ inputs.base }}
      # The change's preview: the built site as an artifact (until the
      # owner picks a host with previews).
      - if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: target/site
          retention-days: 14

  fragments:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache: lint
      - run: cargo test -p xtask
      # A fragment when crates/, editors/ or docs/book/ changed since the
      # base, and each fragment's book pages in the diff.
      - run: cargo xtask docs-gate "$BASE"
        env:
          BASE: ${{ inputs.base }}

  install-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: changed
        shell: bash
        run: cargo xtask ci changed --base "$BASE" scripts/install. crates/k_cli/tests/install_script.rs crates/k_cli/tests/support/release.rs
        env:
          BASE: ${{ inputs.base }}
      # Each installer against a fake release with a fake `gh` and a fake
      # GitHub API on loopback; the PowerShell one where pwsh is (the
      # release's Windows gate).
      - if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: "cargo test -p k_cli --test it -- install_script::"

  # /next/ (and the newest release, the redirects, versions.json, the
  # install scripts and the index) on GitHub Pages when the run is of main:
  # only for the day the repository is public (GitHub's Free plan has no
  # Pages for a private one), behind K_PAGES_ENABLED (design 48, "Private
  # distribution").
  pages:
    if: vars.K_PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: [lint, test-linux, book]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          mdbook: "true"
          cache: book
      - uses: ./.github/actions/site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site
      - id: deploy
        uses: actions/deploy-pages@v4
