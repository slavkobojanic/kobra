# A nightly: main (or the branch it is started on) through the nightly
# column of the gate, then, when everything passed, the build
# `X.Y.Z-nightly.<date>` as a pre-release (docs/compiler/release.md §8 and
# §9, "nightly.yml"). Only on request (design 48, "CI on request"); there
# is no schedule:
#
#   gh workflow run nightly.yml                   # main, published on green
#   gh workflow run nightly.yml -f publish=false  # the checks only
#
# One nightly per day: its version and tag carry the date, so a second
# published run on the same day fails at `gh release create`. The
# performance job needs a runner named by K_PERF_RUNNER. No job runs on
# macOS (design 48, "Private distribution", kept when the repository went
# public), so nightlies have no macOS archive.
name: nightly

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the nightly pre-release when everything passed"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The project's toolchain image (Cargo.toml's [workspace.metadata.project];
  # crates/k_cli/tests/version.rs checks they agree).
  K_IMAGE: ghcr.io/slavkobojanic/kobra

jobs:
  # `cargo test --workspace` on every CI target's native runner.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          mdbook: "true"
      - shell: bash
        run: cargo test --workspace --no-fail-fast

  # The database tests on Postgres and the browser tests in real Chrome.
  services:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: k
          POSTGRES_DB: k_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cargo test -p k_db -p k_server
        env:
          K_TEST_POSTGRES_URL: postgres://postgres:k@127.0.0.1:5432/k_test
      - run: "cargo test -p k_cli --test it -- chrome:: dist_browser::"
        env:
          K_REQUIRE_CHROME: "1"
      - run: "cargo test -p k_cli --test it -- install_script::"

  lint-and-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          mdbook: "true"
          cache: book
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The Kobra code of the examples in `k fmt`'s canonical form (a compiler-only
      # `k`, without V8).
      - run: cargo run -p k_cli --no-default-features --bin k -- fmt --check examples
      - run: cargo xtask docs build --version next --out target/site
      - run: "cargo test -p k_server --test it -- compat::"
      # /next/'s book, which publish-nightly packs as the nightly's.
      - uses: actions/upload-artifact@v4
        with:
          name: book-next
          path: target/site/next

  # The property suites with raised case counts (docs/compiler/testing.md §2).
  properties:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: release
      - run: "cargo test --release -p k_sema --test it -- properties::"
        env:
          PROPTEST_CASES: "3000"
      - run: "cargo test -p k_syntax --test it -- properties::"
        env:
          PROPTEST_CASES: "20000"
      - run: "cargo test -p k_lsp --test it -- properties::"
        env:
          PROPTEST_CASES: "2000"
      - run: "cargo test -p k_server --test it -- differential:: --test-threads=4"
        env:
          PROPTEST_CASES: "500"

  # Ten minutes per fuzz target (docs/compiler/testing.md §6); a crash is
  # kept as an artifact, to be minimised and committed under fuzz/artifacts/.
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [lex, parse, parse_roundtrip, structured, check, check_structured, check_typed, codegen, codegen_run, rpc_json, http_request, lsp_edits]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          toolchain: nightly
          cache: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: fuzz/seed-corpus.sh
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts

  # The performance budgets need a quiet machine: a self-hosted runner whose
  # label the owner sets in K_PERF_RUNNER (design 48, "The gate"). Until
  # then this job is skipped and the release manager runs the script by hand.
  perf:
    if: vars.K_PERF_RUNNER != ''
    runs-on: ${{ vars.K_PERF_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: perf
      - run: scripts/bench-check.sh

  # The nightly's archives, smoke-tested on the runner that built them.
  # Linux builds in Debian 11 for the glibc 2.31 baseline.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, container: "rust:bullseye", exe: k }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, container: "rust:bullseye", exe: k }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: release-${{ matrix.target }}
      - id: version
        shell: bash
        run: cargo xtask release nightly
      - shell: bash
        run: rustup target add ${{ matrix.target }}
      - shell: bash
        run: cargo build --release -p k_cli --locked --target ${{ matrix.target }}
      - shell: bash
        run: cargo xtask dist archive --target ${{ matrix.target }}
      - shell: bash
        run: cargo xtask dist smoke --k target/${{ matrix.target }}/release/${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: target/dist
    outputs:
      version: ${{ steps.version.outputs.version }}

  # The toolchain image from the Linux archives, then examples/shop built
  # with it (`K_TOOLCHAIN=` the image).
  image:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: target/dist
      - run: mkdir -p target/image
      - run: tar -xzf target/dist/k-${{ needs.build.outputs.version }}-${{ matrix.target }}.tar.gz -C target/image --strip-components 1
      - run: docker build --file docker/toolchain.Dockerfile --tag k-toolchain:ci target/image
      - run: docker build --file examples/shop/Dockerfile --build-arg K_TOOLCHAIN=k-toolchain:ci --build-arg APP=shop --tag k-shop:ci .

  # On green: the nightly as a GitHub pre-release (archives, the book,
  # SHA256SUMS, its index entry and the whole index, which `k toolchain`
  # reads from the newest release), unless started with `publish=false`.
  publish-nightly:
    if: inputs.publish
    needs: [test, services, lint-and-docs, properties, fuzz, build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: target/dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: book-next
          path: target/book
      - run: cargo xtask dist docs target/book --version "${{ needs.build.outputs.version }}" --out target/dist
      - run: cargo xtask dist checksums target/dist
      - run: cargo xtask dist index target/dist --index target/dist/index-entry.json --download "${{ github.server_url }}/${{ github.repository }}/releases/download"
      - run: scripts/ci/release-index.sh target/dist/index.json target/dist/index-entry.json
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release create "v${{ needs.build.outputs.version }}" --prerelease --target "${{ github.sha }}" --title "Kobra ${{ needs.build.outputs.version }}" --notes "Nightly build of main at ${{ github.sha }}." target/dist/k-* target/dist/docs-*.tar.gz target/dist/SHA256SUMS target/dist/index-entry.json target/dist/index.json
        env:
          GH_TOKEN: ${{ github.token }}

  # On red: one open issue collects the failed nightlies.
  report:
    if: failure()
    needs: [test, services, lint-and-docs, properties, fuzz, build, image]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/nightly-issue.sh "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
