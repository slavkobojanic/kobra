# rpc.lock: generated by `k build`; commit it. The shape of every protocol
# this app serves (docs/design/40-workspaces-and-services.md).

[protocols."memos.MemosProtocol"]
service = "memos.MemosProtocol"

[protocols."memos.MemosProtocol".rpcs.audio]
params = [{ name = "id", type = "Uuid" }]
returns = "Bytes"
throws = "memos.MemoError"

[protocols."memos.MemosProtocol".rpcs.delete]
params = [{ name = "id", type = "Uuid" }]
returns = "Void"
throws = "RpcOnlyError"

[protocols."memos.MemosProtocol".rpcs.list]
params = []
returns = "List<memos.MemoSummary>"
throws = "RpcOnlyError"

[protocols."memos.MemosProtocol".rpcs.upload]
params = [{ name = "recordedAt", type = "Date" }, { name = "duration", type = "Duration" }, { name = "mediaType", type = "String" }, { name = "audio", type = "Bytes" }]
returns = "memos.MemoSummary"
throws = "memos.UploadError"

[types."memos.MemoError"]
cases = [
    { name = "notFound" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]

[types."memos.MemoSummary"]
fields = [
    { name = "id", type = "Uuid", number = 1 },
    { name = "recordedAt", type = "Date", number = 2 },
    { name = "duration", type = "Duration", number = 3 },
    { name = "mediaType", type = "String", number = 4 },
    { name = "size", type = "Int", number = 5 },
]

[types."memos.UploadError"]
cases = [
    { name = "notAMemo" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]
