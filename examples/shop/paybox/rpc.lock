# rpc.lock: generated by `k build`; commit it. The shape of every protocol
# this app serves (docs/design/40-workspaces-and-services.md).

[protocols."pay.Payments"]
service = "pay_contracts.pay.Payments"

[protocols."pay.Payments".rpcs.charge]
params = [{ name = "request", type = "pay.ChargeRequest" }]
returns = "pay.Charge"
throws = "pay.ChargeError"

[protocols."pay.Payments".rpcs.refund]
params = [{ name = "request", type = "pay.RefundRequest" }]
returns = "pay.Refund"
throws = "pay.RefundError"

[protocols."pay.Payments".rpcs.registerMerchant]
params = [{ name = "callbackUrl", type = "Url" }]
returns = "pay.Merchant"
throws = "pay.RegistrationError"

[types."pay.CardDetails"]
fields = [
    { name = "number", type = "String", number = 1 },
]

[types."pay.Charge"]
fields = [
    { name = "id", type = "String", number = 1 },
    { name = "reference", type = "String", number = 2 },
    { name = "amount", type = "Money", number = 3 },
    { name = "last4", type = "String", number = 4 },
    { name = "refunded", type = "Money", number = 5 },
]

[types."pay.ChargeError"]
cases = ["unknownMerchant", "invalidAmount", "invalidCard", "declined", "rpcFailure"]

[types."pay.ChargeRequest"]
fields = [
    { name = "reference", type = "String", number = 1 },
    { name = "amount", type = "Money", number = 2 },
    { name = "card", type = "pay.CardDetails", number = 3 },
    { name = "description", type = "String", number = 4 },
]

[types."pay.DeclineReason"]
cases = ["cardDeclined", "insufficientFunds", "expiredCard"]

[types."pay.Merchant"]
fields = [
    { name = "name", type = "String", number = 1 },
    { name = "callbackUrl", type = "Url", number = 2 },
]

[types."pay.Refund"]
fields = [
    { name = "id", type = "String", number = 1 },
    { name = "chargeId", type = "String", number = 2 },
    { name = "reference", type = "String", number = 3 },
    { name = "amount", type = "Money", number = 4 },
]

[types."pay.RefundError"]
cases = ["unknownCharge", "invalidAmount", "exceedsCharge", "rpcFailure"]

[types."pay.RefundRequest"]
fields = [
    { name = "chargeId", type = "String", number = 1 },
    { name = "amount", type = "Money", number = 2 },
]

[types."pay.RegistrationError"]
cases = ["unknownCaller", "rpcFailure"]
