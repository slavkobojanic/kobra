# rpc.lock: generated by `k build`; commit it. The shape of every protocol
# this app serves (docs/design/40-workspaces-and-services.md).

[protocols."admin.AdminProtocol"]
service = "shop.admin.AdminProtocol"

[protocols."admin.AdminProtocol".rpcs.recentOrders]
params = []
returns = "List<store.OrderSummary>"
throws = "RpcOnlyError"

[protocols."admin.AdminProtocol".rpcs.signIn]
params = [{ name = "request", type = "admin.SignInRequest" }]
returns = "Void"
throws = "admin.SignInError"

[protocols."admin.AdminProtocol".rpcs.signOut]
params = []
returns = "Void"
throws = "RpcOnlyError"

[protocols."pay.PaymentEvents"]
service = "pay_contracts.pay.PaymentEvents"

[protocols."pay.PaymentEvents".rpcs.chargeRefunded]
params = [{ name = "refund", type = "pay.Refund" }]
returns = "Void"
throws = "RpcOnlyError"

[protocols."pay.PaymentEvents".rpcs.chargeSucceeded]
params = [{ name = "charge", type = "pay.Charge" }]
returns = "Void"
throws = "RpcOnlyError"

[protocols."paybox.CardProtocol"]
service = "shop.paybox.CardProtocol"

[protocols."paybox.CardProtocol".rpcs.pay]
params = [{ name = "orderId", type = "Uuid" }, { name = "card", type = "paybox.CardForm" }]
returns = "Void"
throws = "paybox.CardPaymentError"

[protocols."store.StoreProtocol"]
service = "shop.store.StoreProtocol"

[protocols."store.StoreProtocol".rpcs.order]
params = [{ name = "id", type = "Uuid" }]
returns = "store.OrderSummary"
throws = "store.LookupError"

[protocols."store.StoreProtocol".rpcs.placeOrder]
params = [{ name = "request", type = "store.OrderRequest" }]
returns = "store.PlacedOrder"
throws = "store.CheckoutError"

[protocols."store.StoreProtocol".rpcs.product]
params = [{ name = "slug", type = "String" }]
returns = "store.ProductSummary"
throws = "store.LookupError"

[protocols."store.StoreProtocol".rpcs.products]
params = []
returns = "List<store.ProductSummary>"
throws = "RpcOnlyError"

[types."admin.SignInError"]
cases = ["invalidCredentials", "rpcFailure"]

[types."admin.SignInRequest"]
fields = [
    { name = "email", type = "EmailAddress", number = 1 },
    { name = "password", type = "String", number = 2 },
]

[types."pay.Charge"]
fields = [
    { name = "id", type = "String", number = 1 },
    { name = "reference", type = "String", number = 2 },
    { name = "amount", type = "Money", number = 3 },
    { name = "last4", type = "String", number = 4 },
    { name = "refunded", type = "Money", number = 5 },
]

[types."pay.Refund"]
fields = [
    { name = "id", type = "String", number = 1 },
    { name = "chargeId", type = "String", number = 2 },
    { name = "reference", type = "String", number = 3 },
    { name = "amount", type = "Money", number = 4 },
]

[types."paybox.CardForm"]
fields = [
    { name = "number", type = "String", number = 1 },
]

[types."paybox.CardPaymentError"]
cases = ["orderNotFound", "notAwaitingPayment", "declined", "invalidCard", "paymentsUnavailable", "rpcFailure"]

[types."store.CheckoutError"]
cases = ["productNotFound", "outOfStock", "paymentUnavailable", "rpcFailure"]

[types."store.LookupError"]
cases = ["notFound", "rpcFailure"]

[types."store.OrderRequest"]
fields = [
    { name = "productSlug", type = "String", number = 1 },
    { name = "quantity", type = "Int", number = 2 },
    { name = "email", type = "EmailAddress", number = 3 },
]

[types."store.OrderStatus"]
cases = ["awaitingPayment", "paid", "needsReview", "cancelled"]

[types."store.OrderSummary"]
fields = [
    { name = "id", type = "Uuid", number = 1 },
    { name = "productName", type = "String", number = 2 },
    { name = "quantity", type = "Int", number = 3 },
    { name = "total", type = "Money", number = 4 },
    { name = "email", type = "EmailAddress", number = 5 },
    { name = "status", type = "store.OrderStatus", number = 6 },
    { name = "placedAt", type = "Date", number = 7 },
]

[types."store.PlacedOrder"]
fields = [
    { name = "orderId", type = "Uuid", number = 1 },
    { name = "paymentUrl", type = "Url", number = 2 },
]

[types."store.ProductSummary"]
fields = [
    { name = "id", type = "Uuid", number = 1 },
    { name = "slug", type = "String", number = 2 },
    { name = "name", type = "String", number = 3 },
    { name = "summary", type = "String", number = 4 },
    { name = "description", type = "String", number = 5 },
    { name = "price", type = "Money", number = 6 },
    { name = "imageUrl", type = "Url", number = 7 },
    { name = "available", type = "Int", number = 8 },
]
