# One Postgres server holding two databases, `shop` and `paybox`, each owned
# by its own role. A StatefulSet keeps its volume across restarts.

apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: k-shop
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: k-shop
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_DB
              value: shop
            - name: POSTGRES_USER
              value: shop
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/db_password
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "--username=shop", "--dbname=shop"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "--username=shop", "--dbname=shop"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
        - name: secrets
          secret:
            secretName: postgres-secrets
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
