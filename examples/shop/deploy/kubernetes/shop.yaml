# The shop: two equal pods behind one Service. Sessions, rate limits and the
# job queue live in Postgres, so any pod answers any request, and paybox's
# events reach whichever pod the Service picks.

apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: k-shop
spec:
  selector:
    app: shop
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: k-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      # Nothing here calls the Kubernetes API. Without this, the token mounted
      # at /var/run/secrets/kubernetes.io would need a directory inside the
      # read-only Secret volume at /run/secrets, and the container fails to start.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      # The preStop sleep (5 s), then `serve` draining for up to
      # K_SHUTDOWN_GRACE (25 s) after SIGTERM, with room to spare.
      terminationGracePeriodSeconds: 35
      containers:
        - name: shop
          image: k-shop:local
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: shop-config
          ports:
            - name: http
              containerPort: 8080
          # Kubernetes takes a stopping pod out of the Service as it starts
          # stopping it, and kube-proxy on each node applies that a moment
          # later. `serve` stops accepting connections on SIGTERM, so without
          # this wait before SIGTERM a rollout refuses connections still routed
          # here (the kind smoke test saw it). The image has no shell, so the
          # wait is the kubelet's own `sleep` action (Kubernetes 1.30+).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: secrets
          secret:
            secretName: shop-secrets
