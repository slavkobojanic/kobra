# rpc.lock: generated by `k build`; commit it. The shape of every protocol
# this app serves (docs/design/40-workspaces-and-services.md).

[protocols."accounts.AuthProtocol"]
service = "call.accounts.AuthProtocol"

[protocols."accounts.AuthProtocol".rpcs.signIn]
params = [{ name = "name", type = "String" }]
returns = "Void"
throws = "accounts.SignInError"

[protocols."accounts.AuthProtocol".rpcs.signOut]
params = []
returns = "Void"
throws = "RpcOnlyError"

[protocols."calls.CallProtocol"]
service = "call.calls.CallProtocol"

[protocols."calls.CallProtocol".rpcs.createRoom]
params = []
returns = "Uuid"
throws = "RpcOnlyError"

[protocols."calls.CallProtocol".rpcs.iceServers]
params = []
returns = "List<IceServer>"
throws = "RpcOnlyError"

[protocols."calls.CallProtocol".rpcs.join]
kind = "channel"
params = [{ name = "room", type = "Uuid" }]
send = "Signal"
receive = "Signal"
refusal = "RpcOnlyError"
throws = "calls.CallError"

[types."accounts.SignInError"]
cases = [
    { name = "invalidName" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]

[types."calls.CallError"]
cases = [
    { name = "roomFull" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]
