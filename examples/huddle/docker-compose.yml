# Huddle as it runs in production, on one machine, with no account anywhere:
# Postgres, two replicas of the app, and nginx in front of them with plain
# round robin (docs/design/44-channels.md, "Example app").
#
#   docker compose up --build --wait
#
# Then open http://localhost:8080 in two browsers and sign in with two names.
# Each page load and each tab's WebSocket may land on either replica:
# messages, who is in a room and typing reach the other replica over
# Postgres LISTEN/NOTIFY, so both people see each other wherever they are
# connected. To watch a replica go away:
#
#   docker compose restart app1
#
# The tabs on app1 show "Reconnecting…", reconnect through nginx to app2,
# restart their channels there with a fresh snapshot, and lose no message.
#
# The database trusts connections on this compose network only: it publishes
# no port, and the stack holds nothing but demo data. A real deployment uses
# DATABASE_PASSWORD_FILE as examples/shop does.
# crates/k_cli/tests/examples.rs checks this file's shape and runs two
# replicas of huddle's dist/app against one Postgres.

name: k-huddle

x-app: &app
  build:
    context: ../..
    dockerfile: examples/huddle/Dockerfile
  image: k-huddle:local
  read_only: true
  restart: unless-stopped
  environment:
    # The address the browser uses (nginx's); WebSocket handshakes from any
    # other origin are refused with 403.
    K_PUBLIC_ORIGIN: http://localhost:8080
    DATABASE_URL: postgres://huddle@db:5432/huddle
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/app", "probe", "http://127.0.0.1:8080/sign-in"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: huddle
      POSTGRES_USER: huddle
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=huddle --dbname=huddle"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Two named replicas rather than `deploy.replicas: 2`, so one can be
  # restarted on its own.
  app1:
    <<: *app

  app2:
    <<: *app

  proxy:
    image: nginx:1.29-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
