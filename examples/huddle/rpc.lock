# rpc.lock: generated by `k build`; commit it. The shape of every protocol
# this app serves (docs/design/40-workspaces-and-services.md).

[protocols."accounts.AuthProtocol"]
service = "huddle.accounts.AuthProtocol"

[protocols."accounts.AuthProtocol".rpcs.signIn]
params = [{ name = "name", type = "String" }]
returns = "Void"
throws = "accounts.SignInError"

[protocols."accounts.AuthProtocol".rpcs.signOut]
params = []
returns = "Void"
throws = "RpcOnlyError"

[protocols."chat.AlertsProtocol"]
service = "huddle.chat.AlertsProtocol"

[protocols."chat.AlertsProtocol".rpcs.follow]
params = [{ name = "room", type = "String" }, { name = "subscription", type = "PushSubscription" }]
returns = "Void"
throws = "chat.RoomError"

[protocols."chat.AlertsProtocol".rpcs.isFollowing]
params = [{ name = "room", type = "String" }, { name = "subscription", type = "PushSubscription" }]
returns = "Bool"
throws = "RpcOnlyError"

[protocols."chat.AlertsProtocol".rpcs.serverKey]
params = []
returns = "EcdsaP256PublicKey?"
throws = "RpcOnlyError"

[protocols."chat.AlertsProtocol".rpcs.unfollow]
params = [{ name = "room", type = "String" }, { name = "subscription", type = "PushSubscription" }]
returns = "Void"
throws = "RpcOnlyError"

[protocols."chat.ChatProtocol"]
service = "huddle.chat.ChatProtocol"

[protocols."chat.ChatProtocol".rpcs.room]
kind = "channel"
params = [{ name = "name", type = "String" }]
send = "chat.ChatCommand"
receive = "chat.ChatEvent"
refusal = "chat.CommandError"
throws = "chat.RoomError"

[protocols."chat.ChatProtocol".rpcs.unlock]
params = [{ name = "room", type = "String" }, { name = "password", type = "String" }]
returns = "Void"
throws = "chat.RoomError"

[protocols."chat.LobbyProtocol"]
service = "huddle.chat.LobbyProtocol"

[protocols."chat.LobbyProtocol".rpcs.lobby]
kind = "channel"
params = []
send = "chat.LobbyCommand"
receive = "chat.LobbyEvent"
refusal = "chat.LobbyError"
throws = "RpcOnlyError"

[types."accounts.SignInError"]
cases = [
    { name = "invalidName" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]

[types."chat.ChatCommand"]
cases = [
    { name = "post", fields = [{ name = "text", type = "String" }, { name = "clientId", type = "Uuid" }] },
    { name = "delete", fields = [{ name = "id", type = "Uuid" }] },
    { name = "typing" },
    { name = "read", fields = [{ name = "upTo", type = "Int" }] },
    { name = "promote", fields = [{ name = "name", type = "String" }] },
    { name = "remove", fields = [{ name = "name", type = "String" }] },
]

[types."chat.ChatEvent"]
cases = [
    { name = "snapshot", fields = [{ name = "messages", type = "List<chat.ChatMessage>" }, { name = "present", type = "List<chat.Member>" }] },
    { name = "posted", fields = [{ name = "message", type = "chat.ChatMessage" }, { name = "clientId", type = "Uuid" }] },
    { name = "deleted", fields = [{ name = "id", type = "Uuid" }] },
    { name = "presence", fields = [{ name = "_0", type = "PresenceChange<chat.Member>" }] },
    { name = "typing", fields = [{ name = "name", type = "String" }] },
    { name = "moderators", fields = [{ name = "names", type = "List<String>" }] },
    { name = "removed", fields = [{ name = "name", type = "String" }] },
]

[types."chat.ChatMessage"]
fields = [
    { name = "id", type = "Uuid", number = 1 },
    { name = "number", type = "Int", number = 2 },
    { name = "author", type = "String", number = 3 },
    { name = "text", type = "String", number = 4 },
    { name = "sentAt", type = "Date", number = 5 },
]

[types."chat.CommandError"]
cases = [
    { name = "invalidText" },
    { name = "notYourMessage" },
    { name = "messageGone" },
    { name = "notModerator" },
    { name = "noSuchMember" },
    { name = "cannotRemoveModerator" },
    { name = "removedFromRoom" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]

[types."chat.LobbyCommand"]
cases = [
    { name = "create", fields = [{ name = "name", type = "String" }, { name = "password", type = "String?" }] },
]

[types."chat.LobbyError"]
cases = [
    { name = "invalidName" },
    { name = "nameTaken" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]

[types."chat.LobbyEvent"]
cases = [
    { name = "snapshot", fields = [{ name = "rooms", type = "List<chat.RoomSummary>" }] },
    { name = "created", fields = [{ name = "room", type = "chat.RoomSummary" }] },
    { name = "posted", fields = [{ name = "room", type = "String" }, { name = "number", type = "Int" }, { name = "author", type = "String" }] },
    { name = "deleted", fields = [{ name = "room", type = "String" }, { name = "number", type = "Int" }, { name = "author", type = "String" }] },
    { name = "read", fields = [{ name = "room", type = "String" }, { name = "upTo", type = "Int" }, { name = "unread", type = "Int" }] },
]

[types."chat.Member"]
fields = [
    { name = "name", type = "String", number = 1 },
]

[types."chat.RoomError"]
cases = [
    { name = "noSuchRoom" },
    { name = "passwordRequired" },
    { name = "wrongPassword" },
    { name = "removed" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]

[types."chat.RoomSummary"]
fields = [
    { name = "name", type = "String", number = 1 },
    { name = "locked", type = "Bool", number = 2 },
    { name = "lastRead", type = "Int", number = 3 },
    { name = "unread", type = "Int?", number = 4 },
]
