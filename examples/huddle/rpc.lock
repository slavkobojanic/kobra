# rpc.lock: generated by `k build`; commit it. The shape of every protocol
# this app serves (docs/design/40-workspaces-and-services.md).

[protocols."accounts.AuthProtocol"]
service = "huddle.accounts.AuthProtocol"

[protocols."accounts.AuthProtocol".rpcs.signIn]
params = [{ name = "name", type = "String" }]
returns = "Void"
throws = "accounts.SignInError"

[protocols."accounts.AuthProtocol".rpcs.signOut]
params = []
returns = "Void"
throws = "RpcOnlyError"

[protocols."chat.ChatProtocol"]
service = "huddle.chat.ChatProtocol"

[protocols."chat.ChatProtocol".rpcs.room]
kind = "channel"
params = [{ name = "name", type = "String" }]
send = "chat.ChatCommand"
receive = "chat.ChatEvent"
refusal = "chat.CommandError"
throws = "chat.RoomError"

[types."accounts.SignInError"]
cases = ["invalidName", "rpcFailure"]

[types."chat.ChatCommand"]
cases = ["post", "delete"]

[types."chat.ChatEvent"]
cases = ["snapshot", "posted", "deleted"]

[types."chat.ChatMessage"]
fields = [
    { name = "id", type = "Uuid", number = 1 },
    { name = "number", type = "Int", number = 2 },
    { name = "author", type = "String", number = 3 },
    { name = "text", type = "String", number = 4 },
    { name = "sentAt", type = "Date", number = 5 },
]

[types."chat.CommandError"]
cases = ["invalidText", "notYourMessage", "messageGone", "rpcFailure"]

[types."chat.RoomError"]
cases = ["noSuchRoom", "rpcFailure"]
