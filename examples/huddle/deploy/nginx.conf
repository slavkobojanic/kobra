# nginx in front of huddle's two replicas (docker-compose.yml): plain round
# robin, no sticky sessions. A reconnect that lands on the other replica
# restarts its channels there with a fresh snapshot; nothing depends on
# reaching the same one (docs/design/44-channels.md, "Server isolates and
# replicas").

upstream huddle {
    server app1:8080;
    server app2:8080;
}

server {
    listen 8080;

    location / {
        proxy_pass http://huddle;
        proxy_set_header Host $host;

        # Channels: the tab's WebSocket at /_k/channels. nginx passes the
        # upgrade only when told to, over HTTP/1.1.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # The server sends a heartbeat every 25 s, so an idle socket stays
        # under this; nginx's default of 60 s would also do, with less room.
        proxy_read_timeout 75s;
    }
}
