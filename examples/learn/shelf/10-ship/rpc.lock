# rpc.lock: generated by `k build`; commit it. The shape of every protocol
# this app serves (docs/design/40-workspaces-and-services.md).

[protocols."accounts.AuthProtocol"]
service = "shelf.accounts.AuthProtocol"

[protocols."accounts.AuthProtocol".rpcs.signIn]
params = [{ name = "credentials", type = "accounts.Credentials" }]
returns = "Void"
throws = "accounts.SignInError"

[protocols."accounts.AuthProtocol".rpcs.signOut]
params = []
returns = "Void"
throws = "RpcOnlyError"

[protocols."accounts.AuthProtocol".rpcs.signUp]
params = [{ name = "credentials", type = "accounts.Credentials" }]
returns = "Void"
throws = "accounts.SignUpError"

[protocols."books.BookProtocol"]
service = "shelf.books.BookProtocol"

[protocols."books.BookProtocol".rpcs.add]
params = [{ name = "draft", type = "books.BookDraft" }]
returns = "books.Book"
throws = "RpcOnlyError"

[protocols."books.BookProtocol".rpcs.get]
params = [{ name = "id", type = "Uuid" }]
returns = "books.Book"
throws = "books.LookupError"

[protocols."books.BookProtocol".rpcs.list]
params = []
returns = "List<books.Book>"
throws = "RpcOnlyError"

[protocols."books.BookProtocol".rpcs.review]
params = [{ name = "id", type = "Uuid" }, { name = "review", type = "books.BookReview" }]
returns = "books.Book"
throws = "books.LookupError"

[types."accounts.Credentials"]
fields = [
    { name = "email", type = "EmailAddress", number = 1 },
    { name = "password", type = "String", number = 2 },
]

[types."accounts.SignInError"]
cases = [
    { name = "invalidCredentials" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]

[types."accounts.SignUpError"]
cases = [
    { name = "emailTaken" },
    { name = "closed" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]

[types."books.Book"]
fields = [
    { name = "id", type = "Uuid", number = 1 },
    { name = "title", type = "String", number = 2 },
    { name = "author", type = "String", number = 3 },
    { name = "notes", type = "String", number = 4 },
    { name = "rating", type = "Int", number = 5 },
]

[types."books.BookDraft"]
fields = [
    { name = "title", type = "String", number = 1 },
    { name = "author", type = "String", number = 2 },
]

[types."books.BookReview"]
fields = [
    { name = "notes", type = "String", number = 1 },
    { name = "rating", type = "Int", number = 2 },
]

[types."books.LookupError"]
cases = [
    { name = "notFound" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]
