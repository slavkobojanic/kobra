# rpc.lock: generated by `k build`; commit it. The shape of every protocol
# this app serves (docs/design/40-workspaces-and-services.md).

[protocols."accounts.AuthProtocol"]
service = "notes.accounts.AuthProtocol"

[protocols."accounts.AuthProtocol".rpcs.isEmailAvailable]
params = [{ name = "email", type = "EmailAddress" }]
returns = "Bool"
throws = "RpcOnlyError"

[protocols."accounts.AuthProtocol".rpcs.passkeySignInOptions]
params = []
returns = "PasskeyRequestOptions"
throws = "RpcOnlyError"

[protocols."accounts.AuthProtocol".rpcs.passkeySignUpOptions]
params = []
returns = "PasskeyCreationOptions"
throws = "RpcOnlyError"

[protocols."accounts.AuthProtocol".rpcs.signIn]
params = [{ name = "credentials", type = "accounts.Credentials" }]
returns = "Void"
throws = "accounts.SignInError"

[protocols."accounts.AuthProtocol".rpcs.signInWithPasskey]
params = [{ name = "assertion", type = "PasskeyAssertion" }]
returns = "Void"
throws = "accounts.SignInError"

[protocols."accounts.AuthProtocol".rpcs.signOut]
params = []
returns = "Void"
throws = "RpcOnlyError"

[protocols."accounts.AuthProtocol".rpcs.signUp]
params = [{ name = "request", type = "accounts.SignUpRequest" }]
returns = "Void"
throws = "accounts.SignUpError"

[protocols."accounts.AuthProtocol".rpcs.signUpWithPasskey]
params = [{ name = "email", type = "EmailAddress" }, { name = "registration", type = "PasskeyRegistration" }]
returns = "Void"
throws = "accounts.SignUpError"

[protocols."notes.NotesProtocol"]
service = "notes.NotesProtocol"

[protocols."notes.NotesProtocol".rpcs.create]
params = [{ name = "draft", type = "notes.NoteDraft" }]
returns = "notes.NoteSummary"
throws = "RpcOnlyError"

[protocols."notes.NotesProtocol".rpcs.delete]
params = [{ name = "id", type = "Uuid" }]
returns = "Void"
throws = "RpcOnlyError"

[protocols."notes.NotesProtocol".rpcs.get]
params = [{ name = "id", type = "Uuid" }]
returns = "notes.NoteSummary"
throws = "notes.LookupError"

[protocols."notes.NotesProtocol".rpcs.setPinned]
params = [{ name = "id", type = "Uuid" }, { name = "isPinned", type = "Bool" }]
returns = "notes.NoteSummary"
throws = "notes.LookupError"

[protocols."notes.NotesProtocol".rpcs.update]
params = [{ name = "id", type = "Uuid" }, { name = "draft", type = "notes.NoteDraft" }, { name = "revision", type = "Int" }]
returns = "notes.NoteSummary"
throws = "notes.SaveError"

[protocols."notes.NotesProtocol".rpcs.watch]
params = []
returns = "Stream<notes.NoteChange>"
throws = "RpcOnlyError"

[protocols."vault.VaultProtocol"]
service = "notes.vault.VaultProtocol"

[protocols."vault.VaultProtocol".rpcs.create]
params = [{ name = "vault", type = "vault.StoredVault" }]
returns = "Void"
throws = "vault.VaultError"

[protocols."vault.VaultProtocol".rpcs.get]
params = []
returns = "vault.StoredVault?"
throws = "vault.VaultError"

[protocols."vault.VaultProtocol".rpcs.privateText]
params = [{ name = "id", type = "Uuid" }]
returns = "Sealed<notes.PrivateText>?"
throws = "vault.VaultError"

[protocols."vault.VaultProtocol".rpcs.setPrivateText]
params = [{ name = "id", type = "Uuid" }, { name = "text", type = "Sealed<notes.PrivateText>?" }]
returns = "Void"
throws = "vault.VaultError"

[types."accounts.Credentials"]
fields = [
    { name = "email", type = "EmailAddress", number = 1 },
    { name = "password", type = "String", number = 2 },
]

[types."accounts.SignInError"]
cases = [
    { name = "invalidCredentials" },
    { name = "passkeyNotAccepted" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]

[types."accounts.SignUpError"]
cases = [
    { name = "emailTaken" },
    { name = "passkeyNotAccepted" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]

[types."accounts.SignUpRequest"]
fields = [
    { name = "email", type = "EmailAddress", number = 1 },
    { name = "password", type = "String", number = 2 },
    { name = "confirmPassword", type = "String", number = 3 },
]

[types."notes.LookupError"]
cases = [
    { name = "notFound" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]

[types."notes.NoteChange"]
cases = [
    { name = "snapshot", fields = [{ name = "_0", type = "List<notes.NoteSummary>" }] },
    { name = "saved", fields = [{ name = "_0", type = "notes.NoteSummary" }] },
    { name = "deleted", fields = [{ name = "_0", type = "Uuid" }] },
]

[types."notes.NoteDraft"]
fields = [
    { name = "title", type = "String", number = 1 },
    { name = "body", type = "String", number = 2 },
    { name = "tags", type = "String", number = 3 },
]

[types."notes.NoteSummary"]
fields = [
    { name = "id", type = "Uuid", number = 1 },
    { name = "title", type = "String", number = 2 },
    { name = "body", type = "String", number = 3 },
    { name = "tags", type = "List<String>", number = 4 },
    { name = "isPinned", type = "Bool", number = 5 },
    { name = "revision", type = "Int", number = 6 },
    { name = "updatedAt", type = "Date", number = 7 },
]

[types."notes.PrivateText"]
fields = [
    { name = "body", type = "String", number = 1 },
]

[types."notes.SaveError"]
cases = [
    { name = "notFound" },
    { name = "conflict", fields = [{ name = "latest", type = "notes.NoteSummary" }] },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]

[types."vault.StoredVault"]
fields = [
    { name = "salt", type = "PassphraseSalt", number = 1 },
    { name = "wrappedKey", type = "WrappedKey<AesGcmKey>", number = 2 },
]

[types."vault.VaultError"]
cases = [
    { name = "noVault" },
    { name = "alreadyCreated" },
    { name = "wrongPassphrase" },
    { name = "locked" },
    { name = "tampered" },
    { name = "notFound" },
    { name = "rpcFailure", fields = [{ name = "_0", type = "RpcFailure" }] },
]
