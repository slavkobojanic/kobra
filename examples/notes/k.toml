# Format: docs/design/24-projects.md
#
# The manifest holds only what can't be expressed in K. The default layout,
# the sign-in page and app-wide metadata live in App.k. The database URL comes
# from the environment, never from this committed file (see .env.example and
# docs/design/25-config-and-secrets.md).

[package]
name = "notes"
title = "K Notes"
description = "A full-stack notes app on SQLite: accounts, live updates across tabs, conflict-safe editing."
k = "0.1"
version = "0.1.0"
# `NoteSearch` is a `@Worker` service and `NoteCard.k` and `Notes.k` have
# `preview` declarations: both are preview features
# (docs/design/48-releases-and-versioning.md, "Stability levels").
preview = ["workers", "view-previews"]

# Only the standard library is used, so there are no [dependencies] or
# [aliases].
