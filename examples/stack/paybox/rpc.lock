# rpc.lock: generated by `k build`; commit it. The shape of every protocol
# this app serves (docs/design/40-workspaces-and-services.md).

[protocols."pay.Payments"]
service = "pay_contracts.pay.Payments"

[protocols."pay.Payments".rpcs.charge]
params = [{ name = "request", type = "pay.ChargeRequest" }]
returns = "pay.Charge"
throws = "pay.ChargeError"

[types."pay.Charge"]
fields = [
    { name = "id", type = "String", number = 1 },
    { name = "orderId", type = "String", number = 2 },
    { name = "cents", type = "Int", number = 3 },
    { name = "caller", type = "String", number = 4 },
]

[types."pay.ChargeError"]
cases = ["declined", "rpcFailure"]

[types."pay.ChargeRequest"]
fields = [
    { name = "orderId", type = "String", number = 1 },
    { name = "cents", type = "Int", number = 2 },
]
