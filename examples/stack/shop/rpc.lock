# rpc.lock: generated by `k build`; commit it. The shape of every protocol
# this app serves (docs/design/40-workspaces-and-services.md).

[protocols."checkout.CheckoutApi"]
service = "shop.checkout.CheckoutApi"

[protocols."checkout.CheckoutApi".rpcs.paidCount]
params = []
returns = "Int"
throws = "checkout.CheckoutError"

[protocols."checkout.CheckoutApi".rpcs.pay]
params = [{ name = "orderId", type = "String" }, { name = "cents", type = "Int" }]
returns = "checkout.Receipt"
throws = "checkout.CheckoutError"

[protocols."pay.PaymentEvents"]
service = "pay_contracts.pay.PaymentEvents"

[protocols."pay.PaymentEvents".rpcs.paid]
params = [{ name = "charge", type = "pay.Charge" }]
returns = "Void"
throws = "RpcOnlyError"

[types."checkout.CheckoutError"]
cases = ["declined", "paymentsUnavailable", "rpcFailure"]

[types."checkout.Receipt"]
fields = [
    { name = "chargeId", type = "String", number = 1 },
    { name = "cents", type = "Int", number = 2 },
]

[types."pay.Charge"]
fields = [
    { name = "id", type = "String", number = 1 },
    { name = "orderId", type = "String", number = 2 },
    { name = "cents", type = "Int", number = 3 },
    { name = "caller", type = "String", number = 4 },
]
